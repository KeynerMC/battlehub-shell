services:
  shell:
    build: .
    ports:
      - "${SHELL_PORT:-4000}:8080"
    environment:
      PORT: "8080"
      BATTLEHUB_AUTH_MODE: ${BATTLEHUB_AUTH_MODE:-mock}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      PROFILE_ACCESS_PATH: ${PROFILE_ACCESS_PATH:-}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL:-}
      MATCHMAKING_SERVICE_URL: ${MATCHMAKING_SERVICE_URL:-}
      REMOTES_CONFIG_JSON: ${REMOTES_CONFIG_JSON:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

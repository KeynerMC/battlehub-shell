<import from="../../games/game-host"></import>
<section class="practice-page">
  <div class="game-section-heading"><div><span class="eyebrow">PRACTICA</span><h1>${gameName || 'Practicar'}</h1></div><a class="button button-secondary" href="/catalog">Volver a juegos</a></div>
  <p class="muted">Practica sin sala. No se guardan partidas ni resultados desde Shell.</p>
  <p if.bind="error" class="alert alert-error" role="alert">${error}</p>
  <div if.bind="context" class="action-row"><button click.trigger="start()" disabled.bind="busy || host.status === 'running' || host.status === 'loading'">Iniciar practica</button><button class="button-secondary" click.trigger="host.pause()" disabled.bind="host.status !== 'running'">Pausar</button><button class="button-secondary" click.trigger="host.resume()" disabled.bind="host.status !== 'paused'">Reanudar</button></div>
  <game-host component.ref="host" context.bind="context" on-exit.bind="onExit"></game-host>
</section>

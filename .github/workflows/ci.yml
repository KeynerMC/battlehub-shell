# Pipeline de CI del Shell (Equipo 3).
# Etapas según 05-cicd-testing-commits.md; versión de Node según ADR-003 (Node 24 LTS, ver .nvmrc).
name: CI - Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            poc/demo-game/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --ci

      - name: Production server tests
        run: npm run test:server

      - name: Install demo dependencies
        run: npm ci
        working-directory: poc/demo-game

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Browser integration tests
        run: npm test
        working-directory: e2e

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image without secrets
        run: docker build --tag battlehub-shell:ci .

      - name: Start preview container
        run: docker run --detach --name shell-smoke --env PORT=9090 --env BATTLEHUB_AUTH_MODE=mock --publish 127.0.0.1:4000:9090 battlehub-shell:ci

      - name: Check health, public config and navigation
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4000/health | grep -q ok
          curl --fail --silent http://localhost:4000/shell-config.js | grep -q BATTLEHUB_AUTH_MODE
          curl --fail --silent http://localhost:4000/catalog | grep -q '<my-app>'
          test "$(docker exec shell-smoke id -u)" != "0"

      - name: Container logs
        if: failure()
        run: docker logs shell-smoke

      - name: Stop container
        if: always()
        run: docker rm --force shell-smoke
